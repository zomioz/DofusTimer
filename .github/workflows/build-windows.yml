name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --clean --noconsole --name DofusTimer main.py
      - name: Smoke test de l'exécutable
        run: |
          $p = Start-Process -FilePath dist\DofusTimer\DofusTimer.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\dofus_timer_selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - run: Compress-Archive -Path dist\DofusTimer -DestinationPath DofusTimer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DofusTimer-windows
          path: DofusTimer-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DofusTimer-windows.zip
